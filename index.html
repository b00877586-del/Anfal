<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Anfal ♡</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <div class="top-title">
            A LITTLE GIFT FOR YOU
        </div>

        <h1 class="name">𝓐𝓷𝓯𝓪𝓵</h1>

        <div class="heart">
            <div class="heart-inner">♡</div>
        </div>

        <h2>Melody of Friendship</h2>

        <div class="message-box">

            <p class="arabic">
                بعض الصداقات لا تُقاس بالوقت،
                بل بالمواقف والذكريات.
            </p>

            <p class="english">
                May your days always be filled
                with beautiful melodies and endless smiles.
            </p>

        </div>

        <button id="surpriseButton">
            Play Your Surprise ♡
        </button>

        <p id="surpriseMessage" class="hidden">
            You deserve all the beautiful things in this world. ♡
        </p>

        <div class="footer">
            Keep Smiling, Beautiful Soul ♡
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
